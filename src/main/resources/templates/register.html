<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create account - Submission Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-8">
    <div class="w-full max-w-sm bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">Create account</h1>
        <p class="text-sm text-gray-500 mb-6">Your checks are saved to your account</p>

        <p th:if="${error}" th:text="${error}" class="mb-4 text-sm text-red-600"></p>

        <form th:action="@{/register}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
                <input id="username" name="username" type="text" required th:value="${username}"
                       class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
                <input id="email" name="email" type="email" required th:value="${email}"
                       class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
                <input id="password" name="password" type="password" required minlength="6"
                       class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" required minlength="6"
                       class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700">
                Create account
            </button>
        </form>

        <p class="text-sm text-gray-500 mt-6">
            Already registered? <a th:href="@{/login}" class="text-blue-600 hover:underline">Log in</a>
        </p>
    </div>
</body>
</html>
