<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in - Submission Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-8">
    <div class="w-full max-w-sm bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">Submission Checker</h1>
        <p class="text-sm text-gray-500 mb-6">Log in to run and review your checks</p>

        <p th:if="${param.error}" class="mb-4 text-sm text-red-600">Invalid username or password.</p>
        <p th:if="${param.logout}" class="mb-4 text-sm text-gray-600">You have been logged out.</p>
        <p th:if="${param.registered}" class="mb-4 text-sm text-green-700">Account created. Please log in.</p>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
                <input id="username" name="username" type="text" required autofocus
                       class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
                <input id="password" name="password" type="password" required
                       class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700">
                Log in
            </button>
        </form>

        <p class="text-sm text-gray-500 mt-6">
            New here? <a th:href="@{/register}" class="text-blue-600 hover:underline">Create an account</a>
        </p>
    </div>
</body>
</html>
